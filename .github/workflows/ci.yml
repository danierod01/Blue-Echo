name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — tests + auditoría
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests (pytest)
        run: python -m pytest -q

      - name: Auditoría de dependencias (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        # No bloquea el build: un CVE nuevo aguas arriba no debe tumbar CI,
        # pero queda reportado en el log del job para revisarlo.
        continue-on-error: true

  frontend:
    name: Frontend — build + auditoría
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (tsc + vite build)
        run: npm run build

      - name: Auditoría de dependencias (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true
