server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No exponer versión de Nginx
    server_tokens off;

    # Cabeceras de seguridad
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header Referrer-Policy           "no-referrer"     always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
        always;

    # Gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Caché agresiva para assets con hash en el nombre (Vite los genera así)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Limitar tamaño máximo de uploads (sincronizar con MAX_UPLOAD_SIZE_MB del backend)
    client_max_body_size 10m;

    # Proxy al backend para todas las rutas /api/*
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router: redirigir todo lo demás a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
