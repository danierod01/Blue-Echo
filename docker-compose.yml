services:

  # Base de datos PostgreSQL (roadmap R2)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blueecho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${POSTGRES_DB:-blueecho}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # No se expone al exterior: solo accesible por el backend en la red interna
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blueecho} -d ${POSTGRES_DB:-blueecho}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Broker de mensajes / backend de resultados para Celery (roadmap R3)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Worker Celery: procesa los escaneos encolados en /api/scan/async (R3)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blueecho}:${POSTGRES_PASSWORD:-change_me_in_env}@db:5432/${POSTGRES_DB:-blueecho}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # -B ejecuta el scheduler (beat) embebido para la monitorización periódica de la watchlist
    command: celery -A ioc_correlator.celery_app worker --beat --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Apuntar la BD al servicio Postgres (psycopg v3). Sobreescribe el
      # DATABASE_URL del .env, que por defecto es SQLite para desarrollo local.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blueecho}:${POSTGRES_PASSWORD:-change_me_in_env}@db:5432/${POSTGRES_DB:-blueecho}
      # Cola de tareas en segundo plano (roadmap R3)
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # El backend NO expone puerto al exterior: solo accesible via Nginx
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
